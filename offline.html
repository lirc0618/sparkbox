<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6E6" />
    <title>Sparkbox · 离线</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f4ef; color: #111; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 20% 10%, #fff3ba, transparent 34%), radial-gradient(circle at 88% 18%, #ddfbf0, transparent 30%), #f5f4ef; }
      main { width: min(460px, 100%); border: 1px solid rgba(17,17,17,.12); border-radius: 32px; background: rgba(255,255,255,.78); padding: 30px; box-shadow: 0 20px 50px rgba(17,17,17,.1); }
      img { width: 68px; height: 68px; border-radius: 20px; box-shadow: 0 12px 28px rgba(17,17,17,.12); }
      h1 { margin: 22px 0 10px; font-size: clamp(28px, 8vw, 42px); line-height: 1.05; letter-spacing: -.05em; }
      p { margin: 0 0 18px; color: rgba(17,17,17,.66); font-size: 14px; line-height: 1.75; }
      a, button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; border: 1px solid #111; border-radius: 14px; background: #111; padding: 0 16px; color: white; font-weight: 800; text-decoration: none; cursor: pointer; }
      small { display: block; margin-top: 16px; color: rgba(17,17,17,.52); line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon.svg" alt="Sparkbox" />
      <h1>当前离线，但你的本机收藏还在。</h1>
      <p>请先回到已缓存的 Sparkbox 页面继续查看本机数据；新增和修改会留在本机，联网后再手动同步到云端。</p>
      <a href="/#/inbox">返回 Sparkbox</a>
      <small>如果这是第一次打开应用，需要先联网加载一次，之后才能离线访问核心页面。</small>
    </main>
  </body>
</html>
